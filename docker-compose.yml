services:
  db:
    image: postgres:15-alpine
    container_name: db_optic
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opticsuit}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opticsuit}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: api_optic
    restart: on-failure
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-opticsuit};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    volumes:
      - ./OpticBackend:/app
    working_dir: /app
    ports:
      - "127.0.0.2:80:8080"
    command: >
      /bin/bash -c "
        echo '⏳ Esperando a que PostgreSQL esté listo...' &&
        until (echo > /dev/tcp/${DB_HOST:-db}/${DB_PORT:-5432}) 2>/dev/null; do
          echo '   DB no disponible, reintentando en 2s...';
          sleep 2;
        done &&
        echo '✅ DB disponible. Iniciando backend...' &&
        dotnet watch run --urls http://0.0.0.0:8080
      "
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: web_optic
    restart: always
    volumes:
      - ./OpticFrontend:/app
    working_dir: /app
    ports:
      - "127.0.0.3:80:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
